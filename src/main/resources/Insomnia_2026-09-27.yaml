collection:
  - url: localhost:8080/api/v1/delivery-points
    name: ✅Registrar Punto de Entrega (con ventana de tiempo)
    meta:
      id: req_a1b2c3d4e5f64a7b8c9d0e1f2a3b4c5d
      created: 1790532998500
      modified: 1790532998500
      isPrivate: false
      description: "Registra un nuevo punto de entrega con ventana de tiempo. El campo address es opcional (se puede omitir si se proveen lat/lon). El campo timeWindow es opcional."
      sortKey: -1790532998500
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "reference": "Bodega Central Norte",
          "address": "Av. Insurgentes Norte 1235, Col. Lindavista, CDMX",
          "latitude": 19.4978,
          "longitude": -99.1269,
          "timeWindow": {
            "start": "2026-10-01T08:00:00-06:00",
            "end": "2026-10-01T17:00:00-06:00"
          }
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.0.0
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
