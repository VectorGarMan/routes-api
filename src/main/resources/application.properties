spring.application.name=routesservices
maps.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}
maps.mapbox.base-url=${MAPBOX_BASE_URL:https://api.mapbox.com}

optimizer.python.base-url=${OPTIMIZER_SERVICE_URL:http://localhost:8000}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/routesservices}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
